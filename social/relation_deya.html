<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Relation Profile System</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Inter',sans-serif;
  background:#050816;
  color:white;
  overflow-x:hidden;
}

.bg{
  position:fixed;
  width:100%;
  height:100%;
  z-index:-1;
  background:
    radial-gradient(circle at top left,#1e293b 0%,transparent 30%),
    radial-gradient(circle at bottom right,#312e81 0%,transparent 35%),
    #050816;
}

.container{
  width:1200px;
  max-width:95%;
  margin:auto;
  padding:120px 0 60px;
}

.switcher{
  position:fixed;
  top:20px;
  right:20px;
  display:flex;
  gap:12px;
  z-index:999;
}

.switch-btn{
  border:none;
  outline:none;
  padding:12px 18px;
  border-radius:14px;
  background:rgba(255,255,255,0.08);
  color:white;
  cursor:pointer;
  transition:0.3s;
  font-weight:600;
  backdrop-filter:blur(12px);
}

.switch-btn:hover{
  transform:translateY(-2px);
}

.hero{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:40px;
  align-items:center;
  margin-bottom:60px;
}

.card{
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.08);
  backdrop-filter:blur(12px);
  border-radius:28px;
  padding:32px;
  box-shadow:0 10px 40px rgba(0,0,0,0.35);
}

.title{
  font-size:4rem;
  font-weight:800;
  margin-bottom:16px;
  line-height:1;
}

.subtitle{
  color:#94a3b8;
  margin-bottom:24px;
  line-height:1.7;
}

.tags{
  margin-bottom:24px;
}

.tag{
  display:inline-block;
  padding:10px 18px;
  border-radius:999px;
  margin-right:10px;
  margin-bottom:10px;
  font-size:0.9rem;
  font-weight:600;
}

.quote{
  border-left:4px solid;
  padding-left:20px;
  line-height:1.8;
  color:#cbd5e1;
}

.avatar{
  height:500px;
  border-radius:30px;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow:hidden;
}

.avatar::before{
  content:'';
  position:absolute;
  inset:0;
  background:
    linear-gradient(135deg,
      rgba(255,255,255,0.05),
      transparent);
}

.avatar-label{
  position:absolute;
  font-size:7rem;
  font-weight:900;
  opacity:0.05;
  letter-spacing:12px;
}

.core{
  width:180px;
  height:180px;
  border-radius:50%;
  filter:blur(8px);
  animation:float 4s ease-in-out infinite;
}

.section{
  margin-bottom:60px;
}

.section h2{
  font-size:2rem;
  margin-bottom:24px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  gap:24px;
}

.skill{
  margin-bottom:22px;
}

.skill-header{
  display:flex;
  justify-content:space-between;
  margin-bottom:10px;
}

.bar{
  height:12px;
  background:rgba(255,255,255,0.08);
  border-radius:999px;
  overflow:hidden;
}

.fill{
  height:100%;
  border-radius:999px;
}

.passive{
  padding:24px;
  border-radius:24px;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.08);
}

.passive h3{
  margin-bottom:12px;
}

.tier{
  font-size:5rem;
  font-weight:900;
  text-align:center;
}

footer{
  margin-top:80px;
  text-align:center;
  color:#64748b;
}

@keyframes float{
  0%{
    transform:translateY(0);
  }
  50%{
    transform:translateY(-18px);
  }
  100%{
    transform:translateY(0);
  }
}

@media(max-width:900px){

  .hero{
    grid-template-columns:1fr;
  }

  .title{
    font-size:3rem;
  }

  .avatar{
    height:320px;
  }

}

</style>
</head>

<body>

<div class="bg"></div>

<div class="switcher">

  <button id="btn-mlyd" class="switch-btn">
    Mlyd
  </button>

  <button id="btn-deya" class="switch-btn">
    Deya
  </button>

</div>

<div class="container">

  <!-- HERO -->
  <section class="hero">

    <div class="card">

      <div id="name" class="title"></div>

      <div id="subtitle" class="subtitle"></div>

      <div id="tags" class="tags"></div>

      <div id="quote" class="quote"></div>

    </div>

    <div id="avatar" class="avatar">

      <div id="avatar-label" class="avatar-label"></div>

      <div id="core" class="core"></div>

    </div>

  </section>

  <!-- MATRIX -->
  <section class="section">

    <h2>EX Skill Matrix</h2>

    <div id="skills" class="grid"></div>

  </section>

  <!-- PASSIVES -->
  <section class="section">

    <h2>Passive Skills</h2>

    <div id="passives" class="grid"></div>

  </section>

  <!-- VERDICT -->
  <section class="section">

    <h2>Class Designation</h2>

    <div class="card">

      <div id="tier" class="tier"></div>

      <div id="verdict"
           class="quote"
           style="margin-top:30px;">
      </div>

    </div>

  </section>

  <footer>
    EX-Skill Character Analysis System.<br>
	Source: <a href="https://chatgpt.com/share/6a0f89e4-b1d8-83ec-8149-99a5c76c1f76">Deya</a>
  </footer>

</div>

<script>

const profiles = {

  mlyd: {

    name:"MLYD",

    subtitle:
      "Guardian Strategist • Emotional Anchor • Reflective Protector",

    quote:
      "He protects through understanding. Calm under pressure, deeply observant, and quietly devoted to people he values.",

    tier:"S",

    verdict:
      "A highly analytical protector with strong emotional restraint, long-term thinking, and nurturing stability.",

    color:"#818cf8",

    bg:
      "linear-gradient(135deg,#111827,#312e81,#0f172a)",

    tags:[
      "SSS Stability Core",
      "Analytical Empath",
      "Slow Burn Devotion"
    ],

    skills:[
      ["Analytical Thinking",95],
      ["Emotional Regulation",90],
      ["Protective Instinct",94],
      ["Long-term Vision",96],
      ["Conflict Handling",85],
      ["Boundary Awareness",88],
      ["Emotional Depth",84],
      ["Emotional Expression",58]
    ],

    passives:[
      [
        "Safe Harbor",
        "Naturally becomes an emotional stabilizer during chaos."
      ],
      [
        "Pattern Reading",
        "Quickly notices behavioral inconsistencies and emotional shifts."
      ],
      [
        "Silent Devotion",
        "Shows affection through consistency and reliability rather than intensity."
      ],
      [
        "Internal Burdening",
        "Tends to carry emotional stress alone without asking for help."
      ]
    ]

  },

  ex: {

  name:"DEYA",

    subtitle:
      "Warm Muse • Emotional Resonator • Affectionate Support",

    quote:
      "She creates emotional warmth effortlessly. Playful, validating, and capable of making people feel deeply understood.",

    tier:"S-",

    verdict:
      "An emotionally expressive and affectionate personality with strong empathy and natural comforting energy.",

    color:"#ec4899",

    bg:
      "linear-gradient(135deg,#4c1d95,#831843,#111827)",

    tags:[
      "SSS Emotional Warmth",
      "Comfort Presence",
      "Heart Resonance Type"
    ],

    skills:[
      ["Emotional Warmth",96],
      ["Affection Delivery",92],
      ["Empathy",90],
      ["Romantic Responsiveness",93],
      ["Playfulness",88],
      ["Social Adaptability",81],
      ["Attachment Intensity",79],
      ["Emotional Stability",70]
    ],

    passives:[
      [
        "Emotional Beacon",
        "Makes people feel emotionally accepted and appreciated quickly."
      ],
      [
        "Adaptive Comfort",
        "Naturally adjusts tone and energy to maintain emotional harmony."
      ],
      [
        "Heart Attachment",
        "Forms emotional bonds rapidly once trust is established."
      ],
      [
        "Mood Sensitivity",
        "Highly affected by emotional inconsistency and distancing."
      ]
    ]

}

};

function render(type){

  const p = profiles[type];

  document.getElementById("name").innerText = p.name;

  document.getElementById("subtitle").innerText = p.subtitle;

  document.getElementById("quote").innerText = p.quote;

  document.getElementById("tier").innerText = p.tier;

  document.getElementById("verdict").innerText = p.verdict;

  document.getElementById("avatar").style.background = p.bg;

  document.getElementById("avatar-label").innerText = p.name;

  document.getElementById("core").style.background =
    `linear-gradient(135deg, ${p.color}, #38bdf8)`;

  document.getElementById("quote").style.borderColor = p.color;

  document.getElementById("tier").style.color = p.color;

  // TAGS
  let tagsHTML = "";

  p.tags.forEach(tag => {

    tagsHTML += `
      <span class="tag"
        style="
          background:${p.color}22;
          color:${p.color};
        ">
        ${tag}
      </span>
    `;

  });

  document.getElementById("tags").innerHTML = tagsHTML;

  // SKILLS
  let skillsHTML = "";

  p.skills.forEach(skill => {

    skillsHTML += `

      <div class="card">

        <div class="skill">

          <div class="skill-header">

            <span>${skill[0]}</span>

            <span>${skill[1]}</span>

          </div>

          <div class="bar">

            <div class="fill"

              style="
                width:${skill[1]}%;
                background:linear-gradient(
                  90deg,
                  ${p.color},
                  #38bdf8
                );
              ">

            </div>

          </div>

        </div>

      </div>

    `;

  });

  document.getElementById("skills").innerHTML = skillsHTML;

  // PASSIVES
  let passiveHTML = "";

  p.passives.forEach(passive => {

    passiveHTML += `

      <div class="passive">

        <h3 style="color:${p.color}">
          ${passive[0]}
        </h3>

        <p>
          ${passive[1]}
        </p>

      </div>

    `;

  });

  document.getElementById("passives").innerHTML =
    passiveHTML;

  // BUTTON ACTIVE
  document.getElementById("btn-mlyd")
    .style.background =
      type === "mlyd"
      ? p.color
      : "rgba(255,255,255,0.08)";

  document.getElementById("btn-deya")
    .style.background =
      type === "ex"
      ? p.color
      : "rgba(255,255,255,0.08)";

}

document
  .getElementById("btn-mlyd")
  .addEventListener("click",() => render("mlyd"));

document
  .getElementById("btn-deya")
  .addEventListener("click",() => render("ex"));

render("mlyd");

</script>

</body>
</html>
